# IK solver for the arm.
# TRAC-IK instead of the default KDL: KDL often fails near joint limits, and we restrict
# the joint limits (bag_cell_description/config/joint_limits.yaml) to keep one arm posture.
# solve_type Speed = first solution found (Distance always uses the full timeout: 50 ms per
# waypoint, ~2 s per straight move). The tight joint limits already keep one arm family.
ur_manipulator:
  kinematics_solver: trac_ik_kinematics_plugin/TRAC_IKKinematicsPlugin
  kinematics_solver_timeout: 0.05
  solve_type: Speed
