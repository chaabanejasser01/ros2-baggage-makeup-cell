# UR20 joint limits FOR THIS CELL (efforts/velocities from ur_description/config/ur20/
# joint_limits.yaml, only the position ranges changed). The real robot can turn most joints +-360 deg, so one tool
# pose has many joint solutions (base turned the other way, elbow down, wrist flipped...).
# The planner picked one at random and often got stuck. Here we only allow the family the cell
# needs: base -160..200 deg (cart B ~-125, belt ~0, cart A ~90),
# upper arm above horizontal, elbow up, tool pointing down (wrist 2 not flipped).
# MoveIt keeps a 0.15 rad (8.6 deg) safety margin inside each range, so the start pose
# (elbow 0, wrist 2 at 0) must be more than 8.6 deg away from a limit.
joint_limits:
  shoulder_pan_joint:
    # acceleration limits are not publicly available
    has_acceleration_limits: false
    has_effort_limits: true
    has_position_limits: true
    has_velocity_limits: true
    max_effort: 738.0
    max_position: !degrees  200.0
    max_velocity: !degrees  120.0
    min_position: !degrees -160.0
  shoulder_lift_joint:
    # acceleration limits are not publicly available
    has_acceleration_limits: false
    has_effort_limits: true
    has_position_limits: true
    has_velocity_limits: true
    max_effort: 738.0
    max_position: !degrees  0.0
    max_velocity: !degrees  120.0
    min_position: !degrees -180.0
  elbow_joint:
    # acceleration limits are not publicly available
    has_acceleration_limits: false
    has_effort_limits: true
    has_position_limits: true
    has_velocity_limits: true
    max_effort: 433.0
    # we artificially limit this joint to half its actual joint position limit
    # to avoid (MoveIt/OMPL) planning problems, as due to the physical
    # construction of the robot, it's impossible to rotate the 'elbow_joint'
    # over more than approx +- 1 pi (the shoulder lift joint gets in the way).
    #
    # This leads to planning problems as the search space will be divided into
    # two sections, with no connections from one to the other.
    #
    # Refer to https://github.com/ros-industrial/universal_robot/issues/265 for
    # more information.
    max_position: !degrees  180.0
    max_velocity: !degrees  150.0
    min_position: !degrees -15.0
  wrist_1_joint:
    # acceleration limits are not publicly available
    has_acceleration_limits: false
    has_effort_limits: true
    has_position_limits: true
    has_velocity_limits: true
    max_effort: 107.0
    max_position: !degrees  90.0
    max_velocity: !degrees  210.0
    min_position: !degrees -270.0
  wrist_2_joint:
    # acceleration limits are not publicly available
    has_acceleration_limits: false
    has_effort_limits: true
    has_position_limits: true
    has_velocity_limits: true
    max_effort: 107.0
    max_position: !degrees  20.0
    max_velocity: !degrees  210.0
    min_position: !degrees -190.0
  wrist_3_joint:
    # acceleration limits are not publicly available
    has_acceleration_limits: false
    has_effort_limits: true
    has_position_limits: true
    has_velocity_limits: true
    max_effort: 107.0
    max_position: !degrees  180.0
    max_velocity: !degrees  210.0
    min_position: !degrees -180.0
