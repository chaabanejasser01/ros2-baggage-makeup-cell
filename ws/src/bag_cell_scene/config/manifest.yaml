# Check-in manifest + make-up schedule of this station (one robot cell).
#
# Time is compressed: 1 s of simulation = 1 min of airport time (time_scale).
# The airport clock starts at 'start' when the robot asks for its first bag.
# Each flight's make-up opens at 'open' on a free position (cart A or B) and closes at
# 'close' (about 40 min before departure): its cart is towed to the aircraft and the
# position takes the next flight. Bags are listed in check-in order; the early-bag store
# keeps a bag until its flight's make-up opens.
# TU880 is built at another station: a bag of it here was mis-sorted -> operator.
# Bag sizes: cabin 0.40x0.25x0.20, medium 0.55x0.35x0.25, large 0.70x0.45x0.28 m.
time_scale: 1.0     # airport minutes per simulated second
start: "12:00"
positions: [cart_a, cart_b]
schedule:
  - {flight: TU214, dest: Paris-Orly, std: "14:55", open: "12:00", close: "14:15"}
  - {flight: BJ552, dest: Lyon, std: "16:10", open: "12:00", close: "15:30"}
